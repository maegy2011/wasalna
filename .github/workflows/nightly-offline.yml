# Nightly offline-mode gate (plan §6 + user order: nightly only).
#
# Runs the JVM unit suite (routing geometry, midpoint guard, Arabic
# normalization, manifest parsing, AQI cache) every night at 00:00 UTC.
# Instrumented/emulator tests stay MANUAL (needs GPS mocks + network
# control) — run them locally via:
#   ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=...
name: nightly-offline

on:
  schedule:
    # 00:00 UTC ≈ 02:00/03:00 Cairo — quiet hours.
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin, matches local toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run offline-mode unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
